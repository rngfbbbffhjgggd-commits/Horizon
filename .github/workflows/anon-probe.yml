name: One-off anonymous access check

# TEMPORARY, removed right after reading.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Install httpx
        run: pip install httpx
      - name: Anonymous calls
        run: |
          python - <<'PYANON'
          \
          import httpx

          BASES = [
              ("ai-gateway", "https://ai-gateway.kilo.ai/api/v1/chat/completions"),
              ("api.kilo (old)", "https://api.kilo.ai/api/gateway/chat/completions"),
          ]
          MODELS = [
              "nvidia/nemotron-3-ultra-550b-a55b:free",
              "nvidia/nemotron-3.5-lightning:free",
              "baidu/ernie-5.5-flash-preview:free",
          ]

          for blabel, url in BASES:
              for m in MODELS:
                  body = {"model": m, "messages": [{"role": "user", "content": "Reply with the single word: ok"}],
                          "max_tokens": 12}
                  try:
                      # no Authorization header at all
                      r = httpx.post(url, json=body, timeout=60.0,
                                     headers={"Content-Type": "application/json"})
                      txt = r.text.replace("\n", " ")[:200]
                      said = ""
                      if r.status_code == 200:
                          try:
                              said = r.json()["choices"][0]["message"]["content"][:40]
                          except Exception:
                              said = "<unparsed>"
                      print("%-16s %-45s HTTP %-4s %s | %s" % (blabel, m, r.status_code, said or "-", txt if r.status_code != 200 else ""))
                  except Exception as e:
                      print("%-16s %-45s EXC %s %s" % (blabel, m, type(e).__name__, str(e)[:90]))
          PYANON
