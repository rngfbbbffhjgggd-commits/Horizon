name: Daily Horizon Summary

on:
  schedule:
    # UTC 19:00 = 北京时间 03:00, 提前生成保证早上起床前有日报
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      smtp_test_only:
        description: "Only test SMTP connection, skip digest"
        type: boolean
        default: false

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      - name: Determine fetch window from last digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST_TS=$(gh api "repos/$GITHUB_REPOSITORY/commits?path=_posts&sha=gh-pages&per_page=1" --jq '.[0].commit.committer.date // empty' 2>/dev/null || true)
          if [ -n "$LAST_TS" ]; then
            echo "SINCE=$LAST_TS" >> "$GITHUB_ENV"
          fi

      - name: Test SMTP connection
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          python - <<'EOF'
          import smtplib, os, ssl, json, pathlib
          from email.mime.text import MIMEText
          from email.header import Header

          # 1. Check subscribers.json at runtime
          p = pathlib.Path("data/subscribers.json")
          print("SUBSCRIBERS_EXISTS:", p.exists())
          if p.exists():
              try:
                  data = json.loads(p.read_text(encoding="utf-8"))
                  print("SUBSCRIBERS_CONTENT:", data)
              except Exception as e:
                  print("SUBSCRIBERS_PARSE_ERROR:", e)

          # 2. SMTP connect + login
          try:
              s = smtplib.SMTP_SSL("smtp.qq.com", 465, timeout=15, context=ssl.create_default_context())
              s.login("2337784157@qq.com", os.environ["EMAIL_PASSWORD"])
              print("SMTP_LOGIN_OK")
          except Exception as e:
              print(f"SMTP_LOGIN_FAIL: {type(e).__name__}: {e}")
              raise

          # 3. Send one real test email from Actions
          try:
              msg = MIMEText("This is a test email sent from GitHub Actions environment.", "plain", "utf-8")
              msg["Subject"] = Header("Horizon Actions SMTP Test", "utf-8")
              msg["From"] = "Horizon Daily <2337784157@qq.com>"
              msg["To"] = "2337784157@qq.com"
              s.send_message(msg)
              print("TEST_MAIL_SENT")
          except Exception as e:
              print(f"TEST_MAIL_FAIL: {type(e).__name__}: {e}")
              raise
          s.quit()
          EOF

      - name: Run Horizon
        if: ${{ github.event.inputs.smtp_test_only != 'true' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SINCE: ${{ env.SINCE }}
        run: |
          if [ -n "$SINCE" ]; then
            uv run horizon --since "$SINCE"
          else
            uv run horizon --hours 24
          fi

      - name: Set current date as environment variable (Beijing time)
        if: ${{ github.event.inputs.smtp_test_only != 'true' }}
        run: echo "DATE=$(date -u -d '+8 hours' +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        if: ${{ github.event.inputs.smtp_test_only != 'true' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true