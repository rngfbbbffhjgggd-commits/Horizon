name: Daily Horizon Summary

on:
  schedule:
    # UTC 19:00 = 北京时间 03:00, 提前生成保证早上起床前有日报
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      smtp_test_only:
        description: "Only test SMTP connection, skip digest"
        type: boolean
        default: false

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        # `trafilatura` is an optional extra and is NOT installed by a bare
        # `uv sync`. The enricher now uses it to fetch an article body when the
        # primary model's content filter rejects an item (ContentEnricher.
        # _backfill_content). Without the extra, that lookup silently returns
        # nothing and thin items stay thin — measured 2026-09-19.
        run: uv sync --extra trafilatura

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      - name: Determine fetch window from last digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST_TS=$(gh api "repos/$GITHUB_REPOSITORY/commits?path=_posts&sha=gh-pages&per_page=1" --jq '.[0].commit.committer.date // empty' 2>/dev/null || true)
          # Clamp the fetch start to at most 24h ago. Normally the newest
          # _posts commit is yesterday's digest, but a manual edit of a
          # historical post moves it to "now" and shrinks the window to a few
          # hours -- exactly what happened on 2026-09-14 (4h window, 48 items
          # fetched, a 14-item digest). The digest must always cover a full day.
          CLAMP_TS=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          if [ -n "$LAST_TS" ] && [[ "$LAST_TS" < "$CLAMP_TS" ]]; then
            echo "SINCE=$LAST_TS" >> "$GITHUB_ENV"
            echo "SINCE=$LAST_TS (from newest _posts commit)"
          else
            echo "SINCE=$CLAMP_TS" >> "$GITHUB_ENV"
            echo "SINCE=$CLAMP_TS (clamped to 24h; newest _posts commit was '$LAST_TS')"
          fi

      - name: Test SMTP connection
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run python - <<'EOF'
          import os, sys, json, pathlib, logging, subprocess

          # Make logger output visible
          logging.basicConfig(level=logging.INFO, format="%(levelname)s %(name)s: %(message)s")
          sys.path.insert(0, ".")

          from src.models import EmailConfig

          # 1. Load email config from the real config file
          cfg = json.loads(pathlib.Path("data/config.github.json").read_text(encoding="utf-8"))
          email_cfg = EmailConfig(**cfg["email"])
          print("EMAIL_ENABLED:", email_cfg.enabled)

          # 2. Fetch today's REAL digest markdown
          real = subprocess.check_output(
              ["gh", "api", "repos/rngfbbbffhjgggd-commits/Horizon/contents/_posts/2026-08-28-summary-zh.md?ref=gh-pages",
               "-H", "Accept: application/vnd.github.raw"],
              text=True,
          )
          print("REAL_DIGEST_LEN:", len(real))

          # 3. Send PLAIN-TEXT only version (no HTML) to test Gmail SMTP
          import smtplib, ssl
          from email.mime.text import MIMEText
          from email.header import Header
          try:
              s = smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=20, context=ssl.create_default_context())
              s.login("rngfbbbffhjgggd@gmail.com", os.environ["GMAIL_APP_PASSWORD"])
              msg = MIMEText(real, "plain", "utf-8")
              msg["Subject"] = Header("Horizon Plain Test", "utf-8")
              msg["From"] = "Horizon Daily <rngfbbbffhjgggd@gmail.com>"
              msg["To"] = "rngfbbbffhjgggd@gmail.com"
              s.send_message(msg)
              print("PLAIN_MAIL_SENT_OK")
              s.quit()
          except Exception as e:
              print(f"PLAIN_MAIL_FAIL: {type(e).__name__}: {e}")
              raise

      - name: Run Horizon
        if: ${{ github.event.inputs.smtp_test_only != 'true' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SINCE: ${{ env.SINCE }}
        run: |
          if [ -n "$SINCE" ]; then
            uv run horizon --since "$SINCE"
          else
            uv run horizon --hours 24
          fi

      - name: Set current date as environment variable (Beijing time)
        if: ${{ github.event.inputs.smtp_test_only != 'true' }}
        run: echo "DATE=$(date -u -d '+8 hours' +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        if: ${{ github.event.inputs.smtp_test_only != 'true' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
