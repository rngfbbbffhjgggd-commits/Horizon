name: Daily Horizon Summary

on:
  schedule:
    # UTC 19:00 = 北京时间 03:00, 提前生成保证早上起床前有日报
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      smtp_test_only:
        description: "Only test SMTP connection, skip digest"
        type: boolean
        default: false

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      - name: Determine fetch window from last digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST_TS=$(gh api "repos/$GITHUB_REPOSITORY/commits?path=_posts&sha=gh-pages&per_page=1" --jq '.[0].commit.committer.date // empty' 2>/dev/null || true)
          if [ -n "$LAST_TS" ]; then
            echo "SINCE=$LAST_TS" >> "$GITHUB_ENV"
          fi

      - name: Test SMTP connection
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          uv run python - <<'EOF'
          import os, sys, json, pathlib, logging

          # Make logger output visible
          logging.basicConfig(level=logging.INFO, format="%(levelname)s %(name)s: %(message)s")
          sys.path.insert(0, ".")

          from src.models import EmailConfig
          from src.services.email import EmailManager
          from src.storage.manager import StorageManager

          # 1. Load email config from the real config file
          cfg = json.loads(pathlib.Path("data/config.github.json").read_text(encoding="utf-8"))
          email_cfg = EmailConfig(**cfg["email"])
          print("EMAIL_ENABLED:", email_cfg.enabled)

          # 2. Simulate the EXACT subscriber loading path used in full runs
          storage = StorageManager(data_dir="data")
          subs = storage.load_subscribers()
          print("LOADED_SUBS:", subs)

          # 3. Create EmailManager and send with the loaded subscribers
          manager = EmailManager(email_cfg)
          manager.send_daily_summary(
              "这是完整调用链模拟测试（模拟完整运行的读取和发送路径）。",
              "Horizon Chain Test",
              subs,
          )
          print("CHAIN_TEST_DONE")
          EOF

      - name: Run Horizon
        if: ${{ github.event.inputs.smtp_test_only != 'true' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SINCE: ${{ env.SINCE }}
        run: |
          if [ -n "$SINCE" ]; then
            uv run horizon --since "$SINCE"
          else
            uv run horizon --hours 24
          fi

      - name: Set current date as environment variable (Beijing time)
        if: ${{ github.event.inputs.smtp_test_only != 'true' }}
        run: echo "DATE=$(date -u -d '+8 hours' +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        if: ${{ github.event.inputs.smtp_test_only != 'true' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true