name: Daily Horizon Summary

on:
  schedule:
    # UTC 16:10 = Beijing 00:10. Moved here from 19:00Z on 2026-10-28.
    #
    # Why: the 2026-10-28 issue only went live at 11:21 Beijing. Two costs stack
    # up. GitHub queued the 19:00Z slot for 3h50m (measured delays over eight
    # runs: 2h23m-4h00m), and that run then took 4h31m because 88 of its ~90
    # six-item analysis batches fell back to per-item calls.
    #
    # Why 16:10Z and no earlier: the post is dated with
    # `date -u -d '+8 hours'` taken at run start, so a start before 16:00Z would
    # stamp YESTERDAY's Beijing date on it, find that file already on gh-pages
    # and make the guard skip the whole day. 16:10 leaves a 10 minute margin and
    # is not on the hour, because GitHub documents the top of every hour as its
    # peak queue time.
    - cron: "10 16 * * *"
    # Fallbacks (added 2026-10-15; second slot 2026-10-28).
    #
    # Why they exist: on 2026-10-14 the primary was killed mid-run by a runner
    # shutdown ("The runner has received a shutdown signal") and 2026-10-15
    # shipped no digest at all; nobody noticed until the reader did. Each
    # fallback skips itself when the day's post already exists, or when another
    # digest run is still going, and only generates when the day is missing.
    #
    # Why these slots: a primary at 16:10Z starts (measured) 18:33Z-20:10Z and a
    # slow run can still be going at 00:40Z, so a fallback has to sit well after
    # that to be useful instead of colliding. 20:30Z catches a dropped primary
    # while it is still early morning in Beijing (its own queue delay lands the
    # start around 23:00Z-02:30Z). 02:30Z is the last net of the day.
    - cron: "30 20 * * *"
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      smtp_test_only:
        description: "Only test SMTP connection, skip digest"
        type: boolean
        default: false

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Needed by the fallback guard, which lists this workflow's in-progress
      # runs to avoid starting a second digest while one is still going
      # (2026-10-15). Without it that call returns 403 and the guard falls back
      # to "proceed", which would defeat the protection.
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Guard for the fallback slot (2026-10-15). Only the schedule trigger is
      # gated: a manual dispatch must still be able to regenerate today on
      # demand, even when the post already exists.
      - name: Skip when today's digest already exists
        if: ${{ github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SELF_RUN_ID: ${{ github.run_id }}
        run: |
          DATE=$(date -u -d '+8 hours' +%Y-%m-%d)
          if gh api "repos/$GITHUB_REPOSITORY/contents/_posts/$DATE-summary-zh.md?ref=gh-pages" >/dev/null 2>&1; then
            echo "SKIP=true" >> "$GITHUB_ENV"
            echo "today's digest ($DATE) already exists - nothing to do"
            exit 0
          fi
          OTHERS=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/daily-summary.yml/runs?status=in_progress&per_page=50" \
            --jq "[.workflow_runs[] | select(.id != ($SELF_RUN_ID|tonumber))] | length" 2>/dev/null || echo 0)
          if [ "${OTHERS:-0}" != "0" ]; then
            echo "SKIP=true" >> "$GITHUB_ENV"
            echo "$OTHERS other digest run(s) still in progress - yielding to them"
          else
            echo "no digest for $DATE and no run in progress - continuing"
          fi

      - name: Set up Python
        if: ${{ env.SKIP != 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        if: ${{ env.SKIP != 'true' }}
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        if: ${{ env.SKIP != 'true' }}
        # `trafilatura` is an optional extra and is NOT installed by a bare
        # `uv sync`. The enricher now uses it to fetch an article body when the
        # primary model's content filter rejects an item (ContentEnricher.
        # _backfill_content). Without the extra, that lookup silently returns
        # nothing and thin items stay thin — measured 2026-09-19.
        run: uv sync --extra trafilatura

      - name: Prepare GitHub Actions config
        if: ${{ env.SKIP != 'true' }}
        run: cp data/config.github.json data/config.json

      - name: Determine fetch window from last digest
        if: ${{ env.SKIP != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST_TS=$(gh api "repos/$GITHUB_REPOSITORY/commits?path=_posts&sha=gh-pages&per_page=1" --jq '.[0].commit.committer.date // empty' 2>/dev/null || true)
          # Clamp the fetch start to at most 24h ago. Normally the newest
          # _posts commit is yesterday's digest, but a manual edit of a
          # historical post moves it to "now" and shrinks the window to a few
          # hours -- exactly what happened on 2026-09-14 (4h window, 48 items
          # fetched, a 14-item digest). The digest must always cover a full day.
          CLAMP_TS=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          if [ -n "$LAST_TS" ] && [[ "$LAST_TS" < "$CLAMP_TS" ]]; then
            echo "SINCE=$LAST_TS" >> "$GITHUB_ENV"
            echo "SINCE=$LAST_TS (from newest _posts commit)"
          else
            echo "SINCE=$CLAMP_TS" >> "$GITHUB_ENV"
            echo "SINCE=$CLAMP_TS (clamped to 24h; newest _posts commit was '$LAST_TS')"
          fi

      - name: Test SMTP connection
        if: ${{ env.SKIP != 'true' }}
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run python - <<'EOF'
          import os, sys, json, pathlib, logging, subprocess

          # Make logger output visible
          logging.basicConfig(level=logging.INFO, format="%(levelname)s %(name)s: %(message)s")
          sys.path.insert(0, ".")

          from src.models import EmailConfig

          # 1. Load email config from the real config file
          cfg = json.loads(pathlib.Path("data/config.github.json").read_text(encoding="utf-8"))
          email_cfg = EmailConfig(**cfg["email"])
          print("EMAIL_ENABLED:", email_cfg.enabled)

          # 2. Fetch today's REAL digest markdown
          real = subprocess.check_output(
              ["gh", "api", "repos/rngfbbbffhjgggd-commits/Horizon/contents/_posts/2026-08-28-summary-zh.md?ref=gh-pages",
               "-H", "Accept: application/vnd.github.raw"],
              text=True,
          )
          print("REAL_DIGEST_LEN:", len(real))

          # 3. Send PLAIN-TEXT only version (no HTML) to test Gmail SMTP
          import smtplib, ssl
          from email.mime.text import MIMEText
          from email.header import Header
          try:
              s = smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=20, context=ssl.create_default_context())
              s.login("rngfbbbffhjgggd@gmail.com", os.environ["GMAIL_APP_PASSWORD"])
              msg = MIMEText(real, "plain", "utf-8")
              msg["Subject"] = Header("Horizon Plain Test", "utf-8")
              msg["From"] = "Horizon Daily <rngfbbbffhjgggd@gmail.com>"
              msg["To"] = "rngfbbbffhjgggd@gmail.com"
              s.send_message(msg)
              print("PLAIN_MAIL_SENT_OK")
              s.quit()
          except Exception as e:
              print(f"PLAIN_MAIL_FAIL: {type(e).__name__}: {e}")
              raise

      - name: Run Horizon
        if: ${{ github.event.inputs.smtp_test_only != 'true' && env.SKIP != 'true' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SINCE: ${{ env.SINCE }}
        run: |
          if [ -n "$SINCE" ]; then
            uv run horizon --since "$SINCE"
          else
            uv run horizon --hours 24
          fi

      - name: Set current date as environment variable (Beijing time)
        if: ${{ github.event.inputs.smtp_test_only != 'true' && env.SKIP != 'true' }}
        run: echo "DATE=$(date -u -d '+8 hours' +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        if: ${{ github.event.inputs.smtp_test_only != 'true' && env.SKIP != 'true' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
