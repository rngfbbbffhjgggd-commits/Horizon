name: One-off key check

# TEMPORARY, removed right after reading.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install httpx
        run: pip install httpx
      - name: Check secrets
        env:
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python - <<'PYKEY'
          \
          import json, os
          import httpx

          CASES = [
              ("kilo  nemotron", "https://api.kilo.ai/api/gateway", "KILO_API_KEY",
               "nvidia/nemotron-3-ultra-550b-a55b:free"),
              ("kilo  dots-3", "https://api.kilo.ai/api/gateway", "KILO_API_KEY",
               "dots-studio/dots-3-note-preview:free"),
              ("zhipu glm-4-flash", "https://open.bigmodel.cn/api/paas/v4", "ZHIPU_API_KEY",
               "glm-4-flash"),
              ("deepseek flash", "https://api.deepseek.com", "DEEPSEEK_API_KEY",
               "deepseek-chat"),
          ]

          for label, base, env, model in CASES:
              key = os.environ.get(env) or ""
              if not key:
                  print("%-20s SECRET MISSING (%s)" % (label, env))
                  continue
              print("%-20s key present: len=%d prefix=%s..." % (label, len(key), key[:6]))
              try:
                  r = httpx.post(base.rstrip("/") + "/chat/completions",
                                 headers={"Authorization": "Bearer " + key,
                                          "Content-Type": "application/json"},
                                 json={"model": model,
                                       "messages": [{"role": "user", "content": "ping"}],
                                       "max_tokens": 8},
                                 timeout=45.0)
                  body = r.text[:300].replace("\n", " ")
                  print("    HTTP %s | %s" % (r.status_code, body))
                  if r.status_code == 200:
                      print("    VERDICT: OK")
                  elif r.status_code in (401, 403):
                      print("    VERDICT: KEY REJECTED")
                  elif r.status_code == 429:
                      print("    VERDICT: RATE LIMITED (key works)")
                  elif r.status_code == 404:
                      print("    VERDICT: MODEL NOT FOUND (key may be fine)")
                  else:
                      print("    VERDICT: OTHER")
              except Exception as e:
                  print("    EXCEPTION %s: %s" % (type(e).__name__, str(e)[:160]))
          PYKEY
