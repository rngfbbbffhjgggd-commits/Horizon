name: One-off Kilo client check

# TEMPORARY, added 2026-10-27 and removed right after the result is read.
# Question: does the nightly digest actually send the real KILO_API_KEY now?
# Runs the SAME src/ai/client.py + data/config.github.json the digest uses, with
# only the secret mapped in - never prints the key, only its length/equality.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync --extra trafilatura

      - name: Prepare config the same way the digest does
        run: cp data/config.github.json data/config.json

      - name: Probe the production AI path with the real key
        env:
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: |
          uv run python - <<'PYPROBE'
          """Prove the production AI path, with whatever KILO_API_KEY the environment has.

          Runs twice: locally (no key -> the anonymous path must still work) and inside a
          one-off GitHub Actions job (real secret -> the real-request path).

          Never prints the key: only its length and equality results.
          Run from a directory that contains src/ (repo root) or hz/src (local test copy).
          """
          import asyncio
          import json
          import os
          import sys

          ROOT = os.getcwd()
          sys.path.insert(0, ROOT)
          if not os.path.isdir(os.path.join(ROOT, "src")):
              sys.path.insert(0, os.path.join(ROOT, "hz"))

          from src.ai import tokens  # noqa: E402
          from src.ai.client import ChainedAIClient, create_ai_client  # noqa: E402
          from src.models import AIConfig  # noqa: E402

          fails = []
          checks = 0


          def ok(name, cond, detail=""):
              global checks
              checks += 1
              if not cond:
                  fails.append(name)
              print(("PASS  " if cond else "FAIL  ") + name + (("   [" + str(detail)[:140] + "]") if detail else ""))


          cfg_path = next((p for p in ("data/config.json", "data/config.github.json", "config.github.json")
                           if os.path.exists(p)), None)
          if cfg_path is None:
              raise SystemExit("no config file found next to src/")
          raw = json.load(open(cfg_path, encoding="utf-8"))["ai"]
          print("config file      :", cfg_path)

          ai = AIConfig(**raw)
          ok("config parses and carries an explicit chain",
             isinstance(ai.chain, list) and len(ai.chain) == 3, len(ai.chain or []))
          for i, link in enumerate(ai.chain or [], 1):
              print("   link%d  model=%-46s env=%-14s allow_missing_key=%s"
                    % (i, link.model, link.api_key_env, link.allow_missing_key))

          key = os.getenv("KILO_API_KEY", "").strip()
          print("KILO_API_KEY     : present=%s length=%d" % (bool(key), len(key)))

          client = create_ai_client(ai)
          ok("the production factory builds a ChainedAIClient", isinstance(client, ChainedAIClient), type(client).__name__)
          ok("all three links materialised", len(client.configs) == 3, len(client.configs))
          if len(client.configs) == 3:
              ok("link1 is the nemotron free model",
                 client.configs[0].model == "nvidia/nemotron-3-ultra-550b-a55b:free", client.configs[0].model)
              ok("link3 is still the glm-4-flash floor", client.configs[2].model == "glm-4-flash", client.configs[2].model)

          for i in (0, 1):
              if i >= len(client.configs):
                  break
              c = client._get_client(i)
              hdr = c.client.default_headers or {}
              blanked = hdr.get("Authorization") == ""
              # With a real key the header must be left alone so the SDK sends the bearer;
              # with no key it must be blanked, because the gateway 401s on any bearer and
              # 200s on an empty one (measured 2026-10-21).
              ok("link%d Authorization header is %s" % (i + 1, "blanked (no key in env)" if not key else "left to the SDK (real bearer)"),
                 blanked == (not key), "blanked=%s" % blanked)
              if key:
                  same = str(c.client.api_key) == key
                  ok("link%d will send exactly the KILO_API_KEY from the environment" % (i + 1), same,
                     "match (len %d)" % len(key) if same else
                     "MISMATCH (len %d vs env %d)" % (len(str(c.client.api_key)), len(key)))
              else:
                  ok("link%d uses the anonymous sentinel when no key is set" % (i + 1),
                     str(c.client.api_key) == "no_key", str(c.client.api_key))


          async def call(n):
              return await client.complete(
                  "You are a terse assistant. Reply in plain text only.",
                  "Reply with exactly: OK-%d" % n,
                  max_tokens=32,
              )


          async def burst():
              out = []
              for _ in range(3):
                  out.extend(await asyncio.gather(call(1), call(2)))   # production analysis_concurrency = 2
              return out


          tokens.reset_usage()
          try:
              texts = asyncio.run(burst())
              good = [t for t in texts if t and t.strip()]
              ok("6 real calls, 2 at a time, every one returned text", len(good) == len(texts),
                 "%d/%d ok" % (len(good), len(texts)))
              print("sample           :", repr((good[0] if good else "")[:40]))
          except Exception as exc:  # noqa: BLE001
              ok("6 real calls, 2 at a time, every one returned text", False,
                 "%s: %s" % (type(exc).__name__, str(exc)[:160]))

          snap = tokens.get_usage_snapshot()
          fb = tokens.fallback_snapshot()
          per = {k: v.total for k, v in snap.per_provider.items()}
          print("tokens by channel:", per)
          print("fallback hops    : total=%d rate_limited=%d" % (fb["total"], fb["rate_limited"]))
          ok("no fallback hop was needed", fb["total"] == 0, fb)
          ok("every call was served by the primary free model",
             bool(per) and all("nemotron" in k for k in per), list(per))

          print("=" * 90)
          print("FAILURES: %d / %d checks" % (len(fails), checks))
          for f in fails:
              print("   -", f)
          sys.exit(1 if fails else 0)
          PYPROBE
