name: One-off Kilo key check

# TEMPORARY. Added 2026-10-27 to answer two questions without ever exposing the
# secret: (1) is KILO_API_KEY accepted by the gateway, and (2) does a signed-in
# key still hit the anonymous PROMOTION_MODEL_LIMIT_REACHED allowance.
# workflow_dispatch only; deleted right after the result is read.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the gateway
        env:
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request, urllib.error

          key = os.environ.get("KILO_API_KEY", "")
          # Only ever report the shape, never the value.
          print("key present :", bool(key))
          print("key length  :", len(key))
          if not key:
              print("VERDICT: NO_KEY")
              raise SystemExit(0)

          BASE = "https://api.kilo.ai/api/gateway"
          MODEL = "nvidia/nemotron-3-ultra-550b-a55b:free"

          def post(messages_tokens=8):
              body = json.dumps({
                  "model": MODEL,
                  "messages": [{"role": "user", "content": "Reply with: OK"}],
                  "max_tokens": messages_tokens,
              }).encode()
              req = urllib.request.Request(
                  BASE + "/chat/completions", data=body, method="POST",
                  headers={"Content-Type": "application/json",
                           "Authorization": "Bearer " + key})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return r.status, r.read().decode()[:400]
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()[:400]
              except Exception as e:
                  return 0, "%s: %s" % (type(e).__name__, e)

          code, body = post()
          print("first call  :", code)
          if code != 200:
              print("body        :", body.replace("\n", " "))
              if "PROMOTION_MODEL_LIMIT_REACHED" in body:
                  print("VERDICT: KEY_OK_BUT_PROMOTION_LIMIT")
              elif code == 401:
                  print("VERDICT: KEY_REJECTED")
              else:
                  print("VERDICT: OTHER_ERROR")
              raise SystemExit(0)

          # 30 quick calls: does the key keep us inside a real quota?
          ok = trip = other = 0
          first_trip = ""
          for i in range(30):
              code, body = post()
              if code == 200:
                  ok += 1
              elif "PROMOTION_MODEL_LIMIT_REACHED" in body:
                  trip += 1
                  if not first_trip:
                      first_trip = "after %d calls" % (i + 1)
              else:
                  other += 1
              time.sleep(0.3)

          print("30 calls    : ok=%d promotion429=%d other=%d" % (ok, trip, other))
          if first_trip:
              print("first trip  :", first_trip)
          if trip == 0 and ok >= 25:
              print("VERDICT: KEY_WORKS_NO_PROMOTION_LIMIT")
          elif trip > 0:
              print("VERDICT: PROMOTION_LIMIT_STILL_APPLIES")
          else:
              print("VERDICT: MIXED")
          PY
