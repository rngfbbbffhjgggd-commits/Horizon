name: One-off email (NVIDIA support)

# TEMPORARY. Added 2026-10-21 at the user's request to send a single account
# verification email for build.nvidia.com. workflow_dispatch only (never on a
# schedule), and deleted right after the message goes out.
on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send the email
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python - <<'PY'
          import os, smtplib, ssl
          from email.mime.text import MIMEText
          from email.header import Header

          body = """Hello NVIDIA Support Team,

          I cannot generate an API key on build.nvidia.com. The API Keys page shows:

              "API Access Unavailable. Please contact support to verify your account access."

          The "Contact Support" button on that same page does not open or navigate
          anywhere, so there is no way to reach you from there.

          Could you please verify my account and enable the Public API Endpoints
          permission for my personal organization?

            Account / organization : dghiuadnfi
            Sending from           : rngfbbbffhjgggd@gmail.com
            Country                : China
            Purpose                : personal, non-commercial development. I maintain
                                     a small open-source daily news digest and want to
                                     evaluate the NIM API (deepseek-v4.1-flash /
                                     glm-5.3). No commercial use, no redistribution.

          If you need me to confirm from a specific address or provide anything else,
          please let me know and I will reply from the same mailbox.

          Thank you.
          """

          msg = MIMEText(body, "plain", "utf-8")
          msg["Subject"] = Header("Manual account verification for API access (build.nvidia.com)", "utf-8")
          msg["From"] = "Horizon Owner <rngfbbbffhjgggd@gmail.com>"
          msg["To"] = "help@build.nvidia.com"

          ctx = ssl.create_default_context()
          with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=30, context=ctx) as s:
              s.login("rngfbbbffhjgggd@gmail.com", os.environ["GMAIL_APP_PASSWORD"])
              refused = s.send_message(msg)
          print("SENT to help@build.nvidia.com")
          print("refused recipients:", refused)
          PY
