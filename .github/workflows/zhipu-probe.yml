name: One-off zhipu probe

# TEMPORARY, removed right after reading.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install httpx
        run: pip install httpx
      - name: Probe
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: |
          python - <<'PYZP'
          \
          import json, os
          import httpx

          KEY = os.environ.get("ZHIPU_API_KEY") or ""
          BASE = "https://open.bigmodel.cn/api/paas/v4"
          print("key present:", bool(KEY), "len:", len(KEY))

          MODELS = [
              "glm-4-flash",
              "glm-4-flash-250414",
              "glm-4-flashx",
              "glm-4-air",
              "glm-4-air-250414",
              "glm-4-plus",
              "glm-4.5",
              "glm-4.5-air",
              "glm-4.6",
              "glm-z1-flash",
              "glm-z1-air",
          ]

          H = {"Authorization": "Bearer " + KEY, "Content-Type": "application/json"}
          for m in MODELS:
              try:
                  r = httpx.post(BASE + "/chat/completions", headers=H,
                                 json={"model": m,
                                       "messages": [{"role": "user", "content": "ping"}],
                                       "max_tokens": 4},
                                 timeout=40.0)
                  body = r.text.replace("\n", " ")[:200]
                  print("%-22s HTTP %-4s %s" % (m, r.status_code, body))
              except Exception as e:
                  print("%-22s EXC %s %s" % (m, type(e).__name__, str(e)[:100]))
          PYZP
